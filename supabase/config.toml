project_id = "brigo"

[auth]
site_url = "http://127.0.0.1:5173/"
additional_redirect_urls = ["http://127.0.0.1:5173/#account", "http://localhost:5173/#account"]
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[functions.game]
# The handler verifies every bearer token with Auth /user, supporting signing-key rotation.
verify_jwt = false
entrypoint = "./functions/game/index.ts"

[functions.contact]
# Public contact form: checks origin, payload and a single-use Turnstile token in code.
verify_jwt = false
entrypoint = "./functions/contact/index.ts"
